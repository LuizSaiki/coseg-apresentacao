<div id="cap0" class="cap">Este é o projeto COSEG aberto no VS Code. Tudo o que importa fica na pasta reservas.</div>
<div id="cap1" class="cap">No arquivo models.py estão as tabelas do banco. Primeiro, o Veículo: código, categoria e capacidade.</div>
<div id="cap2" class="cap">A capacidade vem da categoria: leve = 4 lugares, coletivo = 18.</div>
<div id="cap3" class="cap">Depois, a Reserva: quem pediu, origem, destino, data, horários e passageiros.</div>
<div id="cap4" class="cap">Cada reserva aponta para um veículo.</div>
<div id="cap5" class="cap">Em services.py ficam as regras do negócio. A primeira é a capacidade: leve 4, coletivo 18.</div>
<div id="cap6" class="cap">Acima de 18 passageiros, nunca; retorno no máximo 1 dia depois.</div>
<div id="cap7" class="cap">De volta ao models.py: antes de salvar, o código compara os passageiros com a capacidade do veículo.</div>
<div id="cap8" class="cap">Passou de 18, ou mais do que cabe no carro escolhido? Rejeita e explica o erro.</div>
<div id="cap9" class="cap">Agora, a validação de datas. Se a data de saída já passou, o servidor devolve um erro.</div>
<div id="cap10" class="cap">O trecho compara a data pedida com a data de hoje.</div>
<div id="cap11" class="cap">E o horário de retorno precisa ser depois da saída; se não for, a reserva é recusada.</div>
<div id="cap12" class="cap">O coração do sistema: há conflito se uma reserva começa antes de a outra terminar</div>
<div id="cap13" class="cap">e termina depois de a outra começar (r.inicio &lt; fim e r.fim &gt; inicio).</div>
<div id="cap14" class="cap">No models.py, a reserva consulta o banco antes de gravar e trava o veículo para ninguém reservar junto.</div>
<div id="cap15" class="cap">Achou conflito? Devolve: “VL-01 já está reservado nesse intervalo”.</div>
<div id="cap16" class="cap">Se o usuário só informa a categoria, o servidor escolhe o veículo: primeiro tira os que já estão ocupados.</div>
<div id="cap17" class="cap">Depois ordena do menor para o maior e sugere o primeiro.</div>
<div id="cap18" class="cap">O urls.py lista os endereços da API: veículos, reservas, cancelar e disponibilidade.</div>
<div id="cap19" class="cap">É por esses endereços que a interface conversa com o servidor.</div>
<div id="cap20" class="cap">No views.py, o login limita tentativas: depois de cinco erros, bloqueia por cinco minutos.</div>
<div id="cap21" class="cap">Só usuários logados acessam o sistema.</div>
<div id="cap22" class="cap">Ao criar uma reserva, tudo ocorre numa transação: ou valida e grava, ou nada é gravado.</div>
<div id="cap23" class="cap">Só o COSEG pode alterar a frota,</div>
